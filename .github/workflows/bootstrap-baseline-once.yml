name: Import exact book pre-review baseline (one shot)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-baseline-once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baseline-pre-review-import
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'silverbjin/physical_ai_ros2'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout target repository with minimal files
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github/workflows/bootstrap-baseline-once.yml
          persist-credentials: true

      - name: Fetch pinned original baseline and verify source tree
        env:
          SOURCE_REPOSITORY: https://github.com/silverbjin/Pysical_AI_ROS2.git
          SOURCE_REF: refs/heads/feat/ch13-section-13-8
          SOURCE_SHA: 6cb0b489c1142f23868be9184e6bb63cc9c58f52
          SOURCE_TREE: a79ec6231a0763710f80134ae2b952aa28106c20
        shell: bash
        run: |
          set -Eeuo pipefail
          git remote add book_source "$SOURCE_REPOSITORY"
          source_head="$(git ls-remote book_source "$SOURCE_REF" | cut -f1)"
          test "$source_head" = "$SOURCE_SHA"
          git -c http.version=HTTP/1.1 fetch --no-tags --depth=1 book_source "$SOURCE_REF"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse FETCH_HEAD^{tree})" = "$SOURCE_TREE"
          echo "PINNED_SOURCE_SHA=$SOURCE_SHA"
          echo "PINNED_SOURCE_TREE=$SOURCE_TREE"

      - name: Import in small fast-forward chunks and verify exact tree
        env:
          SOURCE_SHA: 6cb0b489c1142f23868be9184e6bb63cc9c58f52
          SOURCE_TREE: a79ec6231a0763710f80134ae2b952aa28106c20
          BOOTSTRAP_PATH: .github/workflows/bootstrap-baseline-once.yml
          GIT_HTTP_LOW_SPEED_LIMIT: "1000"
          GIT_HTTP_LOW_SPEED_TIME: "180"
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          SHA = os.environ["SOURCE_SHA"]
          TREE = os.environ["SOURCE_TREE"]
          BOOTSTRAP = os.environ["BOOTSTRAP_PATH"]
          LIMIT = 220 * 1000 * 1000

          def run(*args, input=None, env=None):
              return subprocess.run(args, input=input, env=env, stdout=subprocess.PIPE,
                                    stderr=subprocess.PIPE, check=True).stdout

          raw = run("git", "ls-tree", "-rz", "-l", SHA)
          items = []
          total = 0
          for line in raw.split(b"\0"):
              if not line:
                  continue
              meta, path = line.split(b"\t", 1)
              mode, kind, oid, size = meta.split()
              nbytes = int(size) if size != b"-" else 0
              items.append((mode, kind, oid, nbytes, path))
              total += nbytes
          assert items, "Source tree must not be empty"
          assert all(kind in (b"blob", b"commit") for _, kind, _, _, _ in items)
          assert BOOTSTRAP.encode() not in {item[4] for item in items}, "Bootstrap filename conflicts with source"

          batches = []
          pending = []
          subtotal = 0
          for item in items:
              if pending and subtotal + item[3] > LIMIT:
                  batches.append(pending)
                  pending = []
                  subtotal = 0
              pending.append(item)
              subtotal += item[3]
          if pending:
              batches.append(pending)

          index_file = str(Path(".git") / "baseline-import-index")
          env = os.environ.copy()
          env["GIT_INDEX_FILE"] = index_file
          run("git", "read-tree", "HEAD", env=env)
          prev = run("git", "rev-parse", "HEAD").decode().strip()
          print(f"IMPORT_MANIFEST: files={len(items)} bytes={total} batches={len(batches)}", flush=True)
          for n, batch in enumerate(batches, 1):
              stream = b"".join(
                  mode + b" " + kind + b" " + oid + b"\t" + path + b"\0"
                  for mode, kind, oid, _, path in batch
              )
              run("git", "update-index", "-z", "--index-info", input=stream, env=env)
              tree = run("git", "write-tree", env=env).decode().strip()
              note = (f"import: pre-review baseline chunk {n}/{len(batches)}\n\n"
                      f"Source: silverbjin/Pysical_AI_ROS2@{SHA}\n")
              new_commit = run("git", "-c", "user.name=Baseline Import Bot",
                               "-c", "user.email=41898282+github-actions[bot]@users.noreply.github.com",
                               "commit-tree", tree, "-p", prev, input=note.encode()).decode().strip()
              print(f"CHUNK_START {n}/{len(batches)} files={len(batch)} bytes={sum(x[3] for x in batch)}", flush=True)
              subprocess.run(["git", "-c", "http.version=HTTP/1.1", "push",
                              "origin", f"{new_commit}:refs/heads/main"], check=True)
              prev = new_commit
              print(f"CHUNK_PUSH_PASS {n}/{len(batches)} {new_commit}", flush=True)

          run("git", "update-index", "--force-remove", BOOTSTRAP, env=env)
          final_tree = run("git", "write-tree", env=env).decode().strip()
          print(f"EXPECTED_TREE={TREE} ACTUAL_TREE={final_tree}", flush=True)
          if final_tree != TREE:
              raise SystemExit("BASELINE_TREE_MISMATCH: refusing final import")
          message = (f"import: exact pre-review baseline snapshot\n\n"
                     f"Source repository: silverbjin/Pysical_AI_ROS2\n"
                     f"Source commit: {SHA}\nSource tree: {TREE}\n"
                     f"Files: {len(items)}\nOriginal blob bytes: {total}\n"
                     "All original paths, modes, symlinks and file SHA IDs retained.\n")
          final = run("git", "-c", "user.name=Baseline Import Bot",
                      "-c", "user.email=41898282+github-actions[bot]@users.noreply.github.com",
                      "commit-tree", final_tree, "-p", prev, input=message.encode()).decode().strip()
          subprocess.run(["git", "-c", "http.version=HTTP/1.1", "push",
                          "origin", f"{final}:refs/heads/main"], check=True)
          remote = run("git", "ls-remote", "origin", "refs/heads/main").decode().split()[0]
          assert remote == final, f"Remote head differs: {remote} != {final}"
          print(f"BASELINE_IMPORT_VERIFIED source={SHA} source_tree={TREE} dest_head={final} dest_tree={final_tree}", flush=True)
          PY
